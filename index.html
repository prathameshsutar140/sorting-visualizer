<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoViz — Sorting Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Sorting Visualizer</h1>
        <div class="controls">
            <button id="generate-btn">Generate New Array</button>
            <button id="bubble-sort-btn">Bubble Sort</button>
            <button id="quick-sort-btn">Quick Sort</button>
        </div>
    </header>

    <main>
        <!-- Container where sorting bars will be rendered -->
        <div id="array-container" class="array-container"></div>
    </main>

    <!-- Compile your TypeScript to app.js and link it here -->
    <script src="app.js"></script>
</body>
</html>
